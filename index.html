        <section id="weeklyQuizEntry" class="weekly-quiz-entry"></section>
        <section class="below-fold">
          <div class="section-heading"><div><h2>이 날짜의 다른 사건</h2></div><span id="eventCount" class="count-label"></span></div>
          <div id="moreEvents" class="event-list"></div>
        </section>
      </section>

      <section id="quizView" class="view"><button class="back-button" data-back>← <span>뒤로</span></button><div id="quizContent"></div></section>

        <button class="back-button" data-back>← <span>오늘</span></button>

        <div class="month-controls"><button class="icon-button" id="prevMonth" aria-label="이전 달">‹</button><h2 id="monthLabel"></h2><button class="icon-button" id="nextMonth" aria-label="다음 달">›</button></div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <p class="calendar-lock-hint"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3.5" y="7" width="9" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg> 아직 오지 않은 날의 이야기는 공개 전이에요</p>
        <div id="calendarPreview" class="calendar-preview"></div>
      </section>

      <section id="savedView" class="view">
        <div class="section-heading"><div><h1>저장한 이야기</h1></div></div>
        <div id="savedList" class="saved-list"></div>
